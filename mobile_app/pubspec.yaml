name: mobile_app
description: "Actual PDF Importer — parse a bank statement, review it, import into Actual Budget."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend HTTP client
  dio: ^5.4.3+1

  # Local persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Statement intake
  file_picker: ^8.0.0+1
  # Android share-sheet intake ("share this PDF into the importer"). Pinned
  # to the 1.8.x API — see core/services/share_intent_service.dart's doc
  # comment before bumping this major version.
  receive_sharing_intent: ^1.8.0

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
